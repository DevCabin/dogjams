<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px;
      color: #1f2937;
      margin: 0;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subtitle {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 12px;
    }
    #preview {
      background: #f3f4f6;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      min-height: 60px;
    }
    .status {
      margin: 8px 0;
      padding: 8px 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      display: none;
    }
    .success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .loading { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
      font-weight: 500;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .endpoint-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    #endpoint {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
    }
    #saveEndpoint {
      width: auto;
      padding: 6px 10px;
      font-size: 12px;
    }
    .label {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
      display: block;
    }
  </style>
</head>
<body>
  <h2>
    <span style="display:inline-block;width:22px;height:22px;background:#2563eb;border-radius:5px;text-align:center;line-height:22px;color:#fff;font-size:12px;font-weight:700;">DJ</span>
    DogJams Scraper
  </h2>
  <div class="subtitle">Scrape TEMU products into your catalog</div>

  <label class="label">API Endpoint</label>
  <div class="endpoint-row">
    <input type="text" id="endpoint" placeholder="http://localhost:8000/api/product">
    <button id="saveEndpoint">Save</button>
  </div>

  <label class="label">Preview</label>
  <div id="previewImage" style="text-align:center; margin-bottom:10px;"></div>

  <label class="label" for="editTitle">Title</label>
  <input type="text" id="editTitle" style="width:100%; margin-bottom:8px; padding:6px; border:1px solid #d1d5db; border-radius:6px; font-size:13px;">

  <label class="label" for="editPrice">Price</label>
  <input type="number" step="0.01" id="editPrice" style="width:100%; margin-bottom:8px; padding:6px; border:1px solid #d1d5db; border-radius:6px; font-size:13px;">

  <label class="label" for="editDescription">Description</label>
  <textarea id="editDescription" rows="3" style="width:100%; margin-bottom:12px; padding:6px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; resize:vertical;"></textarea>

  <div id="status" class="status"></div>

  <button id="sendButton" style="display:none;">Send to DogJams</button>

  <div id="noProduct" style="display:none;color:#6b7280;font-size:13px;text-align:center;margin-top:12px;">
    Navigate to a TEMU product page to use this extension.
  </div>

  <script src="popup.js"></script>
</body>
</html>
