<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .status {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .loading {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h2>DogJams Product Sender</h2>
  <p>Send product data to your DogJams site</p>
  
  <div id="status" class="status" style="display: none;"></div>
  
  <button id="sendButton" style="display: none;">Send Product Data</button>
  
  <div id="noProduct" style="display: none;">
    <p>No product data found on this page.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
